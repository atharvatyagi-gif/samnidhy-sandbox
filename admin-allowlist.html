<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Student allow-list · B-Lab</title>
<meta name="robots" content="noindex">
<!-- LOCAL ADMIN TOOL. Never published (scripts/build_site.py does not copy it). Open with:
     python scripts/dev_preview.py   then go to http://127.0.0.1:8765/admin-allowlist.html -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0d0b; color: #f4eee2;
         font-family: system-ui, "Segoe UI", sans-serif; padding: 24px; }
  .card { width: min(520px, 100%); background: #1a1814; border: 1px solid rgba(233,220,192,0.18); border-radius: 18px; padding: 26px; }
  h1 { margin: 0 0 4px; font-size: 1.4rem; } p { color: #cdc4b2; font-size: 0.92rem; }
  label { display: block; font-size: 0.8rem; color: #948a78; margin: 14px 0 6px; }
  input { width: 100%; box-sizing: border-box; font: inherit; color: #f4eee2; background: #0e0d0b; border: 1px solid rgba(233,220,192,0.2); border-radius: 10px; padding: 10px 12px; }
  button { margin-top: 18px; width: 100%; border: 0; border-radius: 12px; padding: 12px; font: inherit; font-weight: 700; cursor: pointer;
           color: #061a10; background: linear-gradient(90deg, #22c55e, #e9dcc0); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .log { margin-top: 16px; font-family: Consolas, monospace; font-size: 0.82rem; white-space: pre-wrap; color: #e9dcc0; }
  .warn { color: #e4b25c; }
</style>
</head>
<body>
<main class="card">
  <h1>Student allow-list upload</h1>
  <p>Uploads <code>private/allowlist_keys.json</code> (made by <code>scripts/student_allowlist.py</code>) to Firestore.
    It contains only one-way keys, no names or dates. Sign in with the admin account named in <code>firestore.rules</code>.</p>
  <label for="em">Admin email</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password">
  <label for="file">allowlist_keys.json</label><input id="file" type="file" accept=".json,application/json">
  <button id="go" type="button">Sign in and upload</button>
  <div class="log" id="log"></div>
</main>
<script type="module">
  import { firebase } from "./auth-check.js";
  import { STUDENTS_COLLECTION, isConfigured } from "./config.js";
  const $ = id => document.getElementById(id), log = t => { $("log").textContent += t + "\n"; };
  if (!isConfigured()) log("Add the Firebase keys to config.js first.");
  $("go").addEventListener("click", async () => {
    $("go").disabled = true; $("log").textContent = "";
    try {
      const f = $("file").files[0];
      if (!f) throw new Error("Choose private/allowlist_keys.json first.");
      const data = JSON.parse(await f.text());
      const keys = (data.keys || []).filter(k => /^[0-9a-f]{64}$/.test(k));
      if (!keys.length) throw new Error("No keys found in that file.");
      const fb = await firebase();
      await fb.authMod.signInWithEmailAndPassword(fb.auth, $("em").value.trim(), $("pw").value);
      log(`Signed in as ${fb.auth.currentUser.email}. Uploading ${keys.length} keys…`);
      const D = fb.dbMod;
      for (let i = 0; i < keys.length; i += 400) {
        const b = D.writeBatch(fb.db);
        keys.slice(i, i + 400).forEach(k => b.set(D.doc(fb.db, STUDENTS_COLLECTION, k), { added: D.serverTimestamp() }));
        await b.commit();
      }
      log(`Done: ${keys.length} students can now register.`);
      await fb.authMod.signOut(fb.auth);
    } catch (e) {
      log((e.code === "permission-denied" ? "Permission denied: is this email set as the admin in firestore.rules (and the rules published)?" : e.message));
    } finally { $("go").disabled = false; }
  });
</script>
</body>
</html>
