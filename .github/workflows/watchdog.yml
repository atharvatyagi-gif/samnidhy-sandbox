# Watchdog: re-runs a failed job once, restarts a missed link of the nightly chain, starts NEXUS if it has not run for a day.
# Fired every hour by the Market clock heartbeat (GitHub's own cron is unreliable; the schedule below is only a backup).
# It never edits data and never cancels anything. See scripts/watchdog.py.
name: Watchdog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2
      - run: python scripts/watchdog.py
