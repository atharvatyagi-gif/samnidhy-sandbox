# Samnidhy Sandbox - Globe: real live flights (OpenSky) + real geopolitical news (GDELT) around 7 shipping
# and oil chokepoints, for the Expert terminal's Globe tab.
# Runs about once an hour, all day (flights and geopolitics aren't tied to NSE market hours, unlike the rest
# of the site), triggered by the market-clock heartbeat - not GitHub's own scheduler, which has proven
# unreliable for this project. Both APIs are free and need no account, but ask not to be hit too often:
# OpenSky has a daily request budget per IP, and GDELT asks for gaps between calls (scripts/globe_data.py
# already paces itself); running this once an hour, not every 15 minutes like the price workflow, respects both.
#
# This job only WRITES data/globe/latest.json and commits it - it deliberately does not rebuild or publish
# the site itself. A fresh checkout here has none of the other workflows' cached/ephemeral data (the terminal
# cache, live.json, etc.), and a Pages deploy replaces the whole site, so building here would wipe out
# everything those other workflows already published. Live prices (every 15-30 min) picks the new file up
# and publishes it on its own next run, same as the daily screen already does for its own data.
name: Globe data

on:
  schedule:
    - cron: "20 * * * *"   # hourly backup in case the heartbeat is ever down
  workflow_dispatch:
  push:
    branches: [main, globe-detailed]
    paths: [".github/workflows/globe-data.yml", "scripts/globe_data.py", "scripts/globe_static.py"]

permissions:
  contents: write

concurrency:
  group: globe-data
  cancel-in-progress: false

jobs:
  globe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Flights, news, ship transits, hazards and map layers
        run: python scripts/globe_data.py

      - name: Save it to the repository (the next Live prices run publishes it)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/globe
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -q -m "Globe data: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
