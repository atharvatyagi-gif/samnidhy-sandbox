# Test job: proves GitHub's servers can download NSE's daily file and pick the stocks.
# Runs automatically whenever the picker changes on the daily-movers branch,
# and can also be started by hand from the repository's Actions tab.
name: Check NSE access from GitHub

on:
  push:
    branches: [daily-movers]
    paths:
      - scripts/pick_movers.py
      - config.toml
      - .github/workflows/check-nse-access.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Pick the last NSE session's top gainers and losers
        run: python scripts/pick_movers.py
