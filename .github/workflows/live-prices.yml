# Samnidhy Sandbox - live prices for the Advanced page.
# Every 15 minutes while the NSE market is open (Mon-Fri, 9:15 AM - 3:30 PM IST), on GitHub's servers:
#   1. delayed prices for every main-board NSE stock (scripts/terminal_live.py, for the Expert terminal)
#   2. re-ranks the NIFTY 500 screen's survivors on those live prices -> new top 10 (scripts/screener_live.py)
#   3. delayed prices + technicals for that top 10 (scripts/live_technicals.py)
#   4. rebuilds the site and publishes it (the Advanced page picks the changes up by itself)
# Live prices are not saved in the repository (that would add a commit every 15 minutes);
# the daily update keeps the screen itself. If a run fails, the site keeps the last prices and the
# Advanced page says how old they are.
name: Live prices

on:
  schedule:
    # Times are UTC (IST = UTC + 5:30). 03:45 UTC = 9:15 IST ... 10:00 UTC = 15:30 IST.
    - cron: "45 3 * * 1-5"
    - cron: "*/15 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
    # outside market hours (and weekends): hourly, so the News tab's financial wire stays fresh
    - cron: "40 10-23,0-2 * * *"
    - cron: "40 3-9 * * 0,6"
  workflow_dispatch:
  push: # a change to the live-price code or to the site's own pages/scripts publishes straight away
    branches: [main]
    paths: [".github/workflows/live-prices.yml", "scripts/live_technicals.py", "scripts/screener_live.py",
            "scripts/build_site.py", "scripts/news_wire.py", "*.html", "*.js", "*.css"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Restore the terminal's NSE data cache
        uses: actions/cache/restore@v4
        with:
          path: data/terminal
          key: terminal-${{ github.run_id }}
          restore-keys: terminal-

      - name: Delayed prices for all main-board stocks (terminal)
        continue-on-error: true
        run: |
          [ -f data/terminal/universe.json ] || python scripts/nse_eod.py
          python scripts/terminal_live.py

      - name: Re-rank the NIFTY 500 screen on live prices (top 10)
        continue-on-error: true   # on failure the last screen stays
        run: python scripts/screener_live.py

      - name: Fetch delayed prices and technicals for the screened stocks
        id: live
        continue-on-error: true   # still publish, so the page shows why prices are unavailable
        run: python scripts/live_technicals.py

      - name: Financial news wire (India markets RSS + brutalist.report)
        continue-on-error: true
        run: python scripts/news_wire.py

      - name: Put the new screen into the Advanced page
        continue-on-error: true
        run: python scripts/embed_data.py

      - name: Rebuild the site
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Report failed live prices
        if: steps.live.outcome == 'failure'
        run: |
          echo "::error::Live prices could not be fetched; see the step above. The page says prices are unavailable."
          exit 1
