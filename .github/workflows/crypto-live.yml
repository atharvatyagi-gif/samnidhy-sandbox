# Bitcoin and Ethereum order-flow paper account (scripts/crypto_live.py): every 15 minutes it reads Binance's public market data, checks stops, acts once per closed 4-hour bar and marks the account to market.
# Simulated money only (hard budget Rs 10,00,000, no leverage). Fills and decisions go to data/crypto/ledger.jsonl (append-only, committed at once); the page data, an hourly equity point and an hourly order-book sample are committed hourly.
# GitHub's scheduler can be late or skip a run: the engine logs a decision made more than 60 minutes after a bar closed as skipped, and the page warns when the last run is older than 45 minutes.
name: Crypto live

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-live
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALADIN_GIT_PUSH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install pandas==2.3.3 numpy==2.3.4 requests==2.34.2 lightgbm==4.7.0 scikit-learn==1.9.1

      - name: Shadow quant account (Bitcoin all-weather model; may fail without touching the live account)
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/crypto_shadow.py

      - name: One engine step
        run: python scripts/crypto_live.py

      - name: Save the ledger at once, the page data and the hourly point when they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/crypto/ledger.jsonl data/crypto/marks.jsonl data/crypto/shadow_ledger.jsonl; then git checkout -- data/crypto/live.json data/crypto/shadow.json 2>/dev/null || true; fi
          # the model, the recent bars and the funding history only with the monthly refit (they are re-fetched every run anyway)
          if git diff --quiet -- data/crypto/quant_model.json 2>/dev/null && git ls-files --error-unmatch data/crypto/quant_model.json >/dev/null 2>&1; then git checkout -- data/crypto/bars_15m_recent.csv.gz data/crypto/funding_btc.csv 2>/dev/null || true; fi
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from gitops import commit_and_push
          import os
          ok = commit_and_push([p for p in ["data/crypto/ledger.jsonl", "data/crypto/marks.jsonl", "data/crypto/depth.jsonl", "data/crypto/live.json", "data/crypto/shadow_ledger.jsonl", "data/crypto/shadow.json", "data/crypto/quant_model.json", "data/crypto/bars_15m_recent.csv.gz", "data/crypto/funding_btc.csv"] if os.path.exists(p)], "Crypto paper account: ledger and marks [skip ci]", min_interval_s=0, state_file="data/crypto_gitops_state.json")
          print("committed and pushed" if ok else "nothing new to save (or push not allowed)")
          PY
