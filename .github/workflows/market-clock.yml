# Samnidhy Sandbox - site heartbeat (was "market clock").
# GitHub's scheduler delays or drops scheduled runs when it is busy (on 30 Sep 2026 it skipped every run from
# 05:54 to 10:20 IST). So instead of depending on it, this job keeps itself alive around the clock and directly
# triggers the other workflows (directly triggered runs start within seconds):
#   - "Live prices" (prices, technicals, news, re-ranked screen, rebuild + publish): every 5 minutes, all day.
#   - "Daily update" (NSE end-of-day files, screen, model): at 07:30, 09:00 and 19:00 IST - deliberately NOT
#       every 5 minutes: NSE only publishes a new end-of-day file once a day, so running this more often would
#       just repeat the same day's data for no benefit.
#   - "Globe data" (live flights + geopolitical news for the Globe tab): about once an hour, all day -
#       deliberately NOT every 5 minutes: OpenSky's anonymous tier gives only 400 requests/day, shared across
#       every GitHub Actions workflow on the runner's IP range, not just this one. This job already uses about
#       7 of those per run; at 5-minute intervals (288 runs/day) that's ~2,000/day, which would blow through the
#       budget and break the feature it's meant to keep working. Hourly (~168/day) comfortably fits.
# Just before GitHub's 6-hour limit it starts its own replacement, so the chain never stops. The hourly schedule
# below is only a safety net that restarts the chain if it ever breaks; extra copies wait in the queue.
name: Market clock

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/market-clock.yml"]

permissions:
  actions: write                    # to trigger the Live prices / Daily update workflows and itself
  contents: read

concurrency:
  group: market-clock
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Heartbeat
        run: |
          start_ts=$(date +%s)
          now() { TZ=Asia/Kolkata date +%H:%M; }
          mins() { local t; t=$(now); echo $((10#${t%:*} * 60 + 10#${t#*:})); }
          fire() { echo "$(now) IST: triggering $1"; gh workflow run "$1" --ref main || echo "  trigger failed, retrying next round"; }
          last_live=0; last_globe=0; daily_done=""
          # starting in the morning before 10:30: make sure the morning daily update happens
          m=$(mins); if [ "$m" -ge $((7 * 60 + 15)) ] && [ "$m" -lt $((10 * 60 + 30)) ]; then fire daily-update.yml; daily_done="$(TZ=Asia/Kolkata date +%F)-am"; fi
          while :; do
            m=$(mins); day=$(TZ=Asia/Kolkata date +%F); t=$(date +%s)
            gap=300
            if [ $((t - last_live)) -ge "$gap" ]; then fire live-prices.yml; last_live=$t; fi
            if [ $((t - last_globe)) -ge 3600 ]; then fire globe-data.yml; last_globe=$t; fi
            for slot in "07:30 am1" "09:00 am2" "19:00 pm"; do
              hhmm=${slot% *}; tag=${slot#* }; sm=$((10#${hhmm%:*} * 60 + 10#${hhmm#*:}))
              if [ "$m" -ge "$sm" ] && [ "$m" -lt $((sm + 20)) ] && [ "$daily_done" != "$day-$tag" ]; then fire daily-update.yml; daily_done="$day-$tag"; fi
            done
            if [ $((t - start_ts)) -gt $((345 * 60)) ]; then
              echo "$(now) IST: handing over to a fresh heartbeat"; fire market-clock.yml; exit 0
            fi
            sleep 60
          done
