# NEXUS supply-chain graph: reads company filings with a free language model (Groq, then Gemini), keeps only edges backed by a
# verbatim quote, finds facility coordinates (OpenStreetMap Nominatim, 1 request a second), audits the result and saves
# data/supply_graph.json. The next Live prices run publishes it (build_site.py), the nightly ALADIN run scores it.
# Daily until the whole Nifty 500 has been read (the builder takes Nifty 500 first and stops cleanly when the day's free quota is used up, resuming next day); filings change only a few times a year, so after that a weekly run is enough.
# The derived-share step reads the related-party notes of companies already in the graph (it resumes where it stopped and skips finished ones).
# Every step may fail: the repository keeps the previous graph, and the file is only saved when check_graph.py says "ok".
# Commits end in "[skip ci]" and touch nothing but data/supply_graph.json.
name: NEXUS graph

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many companies to read this run (the builder resumes from its cache)"
        required: false
        default: "120"

permissions:
  contents: write
  actions: read                 # lets the last step read this run's own step list for the run report

concurrency:
  group: nexus
  cancel-in-progress: false

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        continue-on-error: true
        run: |
          pip install -r requirements.txt
          pip install pypdf jsonschema rapidfuzz

      - name: NSE universe (the builder needs it to recognise listed companies; without it the graph is left untouched)
        continue-on-error: true
        run: '[ -f data/terminal/universe.json ] || python scripts/nse_eod.py'

      - name: Restore the filings and model-answer cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/nexus_cache
          key: nexus-${{ github.run_id }}
          restore-keys: |
            nexus-

      - name: Read filings and build the graph
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          PYTHONUNBUFFERED: "1"
          LIMIT: ${{ github.event.inputs.limit || '120' }}
        timeout-minutes: 170
        run: python scripts/revenue_graph_builder.py --limit "$LIMIT" --max-calls 420    # about 8 model calls and 20 s a call per company: ~50 companies a day, ~2.5 hours

      - name: Derived revenue shares from the related-party notes (companies already read, 40 a week, marked derived)
        continue-on-error: true
        timeout-minutes: 60
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/related_party_shares.py --limit 40 --max-calls 150

      - name: Find facility coordinates
        continue-on-error: true
        env:
          GEOCODE_CONTACT: ${{ secrets.GEOCODE_CONTACT }}
        run: python scripts/geocode_facilities.py

      - name: Audit the graph
        id: audit
        continue-on-error: true
        run: python scripts/check_graph.py

      - name: Save the cache for the next run
        uses: actions/cache/save@v4
        continue-on-error: true
        if: always()
        with:
          path: data/nexus_cache
          key: nexus-${{ github.run_id }}

      - name: Save supply_graph.json to the repository (only when the audit passed)
        if: steps.audit.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/supply_graph.json
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -q -m "NEXUS graph: $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Run report (steps, durations, outputs, fallbacks)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/run_report.py --workflow nexus

      - name: Upload the run report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: run-report-nexus
          path: run_report.json
          if-no-files-found: ignore
