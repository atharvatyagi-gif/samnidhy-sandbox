# Stress-Test Black Box: every seed, path, parameter and threshold lives here. A run is reproducible from (config hash + seed).
run:
  seed_base: 20261015
  seeds: 200                # per strategy x scenario cell
  quick_seeds: 20           # --quick
  gap_seeds: 30             # per parameter value in the GAP sweeps
  quick_gap_seeds: 6
  workers: 0                # 0 = all CPU cores minus one
  results_dir: blackbox/results
  ruin_floor: 0.5           # equity below 50% of the start at any time = ruin
  keep_paths: 40            # seeds whose price/equity paths are saved for the fan charts
  module_seeds: 40          # seeds per scenario for the module checks (the geopolitical index replay is the slow part)

market:                     # the synthetic NSE-like universe (daily bars)
  n_stocks: 300
  warmup_days: 260          # normal market before the evaluated year (indicators need ~250 days)
  eval_days: 252            # the evaluated year, where the scenario happens
  start_date: "2020-01-01"
  drift_ann: 0.10           # market drift in a normal year
  vol_ann: 0.16             # market volatility in a normal year
  idio_vol_ann: [0.18, 0.45]   # range of stock-specific volatility
  beta: [0.6, 1.4]
  t_df: 4                   # Student-t degrees of freedom (fat tails)
  calm_to_turbulent_p: 0.01   # daily chance a calm market turns turbulent
  turbulent_to_calm_p: 0.05   # ... and back (about 1 day in 6 is turbulent)
  turbulent_vol_mult: 1.5
  jumps_per_year: 2.0       # stock-specific jumps
  jump_sd: 0.06
  sectors: {Financials: 0.18, IT: 0.12, Energy: 0.08, Metals: 0.07, Consumer: 0.15, Pharma: 0.10, Industrials: 0.15, Auto: 0.08, Airlines: 0.02, Exporters: 0.05}
  sector_vol_ann: 0.10
  price_range: [40, 4000]   # starting share prices (whole shares matter for the Rs 10,000 account)
  adv_cr_range: [2, 400]    # average daily traded value, Rs crore (log-uniform)
  fno_share: 0.6            # the most liquid 60% have stock futures (shorts possible)
  pairs: 3                  # cointegrated pairs
  extras:                   # other assets the geopolitical scenarios move
    btc: {vol_ann: 0.65, drift_ann: 0.20, beta: 0.4}
    oil: {vol_ann: 0.35, drift_ann: 0.0, beta: 0.1}
    gold: {vol_ann: 0.14, drift_ann: 0.05, beta: -0.1}
    usdinr: {vol_ann: 0.05, drift_ann: 0.02, beta: -0.15}
    bond: {vol_ann: 0.05, drift_ann: 0.06, beta: -0.2}

# The model-driven strategies (ALADIN 1, the movers ranking, the paper trader) cannot run their LightGBM models on synthetic prices.
# They are driven by a STAND-IN score: correlation `ic` with the stock's next-k-day return in the NORMAL part of the move (shocks are
# not foreseeable). CALIBRATION: the AUC formula ic = sin(pi * (AUC - 0.5)) gives 0.14 for ALADIN 1 (AUC 0.544), but with bell-shaped tails that makes the
# best 1% far better than the real bot's record; ic is therefore set so the stand-in's best-1% picks beat the market by what the real bot's best 1% did:
# data/aladin2/paper/backtest.json, 2,758 trades, average +0.59% a trade after ~0.35% costs against a market week of +0.32% -> about +0.6% a week -> ic 0.04.
# 0.14 stays in the sweeps as the "AUC-implied" upper case. The movers stand-in (top TENTH) at its AUC-implied 0.06 matches its own record (~0.4% a week).
oracle:
  aladin1_5d: {horizon: 5, ic: 0.04, source: "calibrated to data/aladin2/paper/backtest.json (best 1%: ~+0.6% a week over the market); AUC 0.544 implies 0.14"}
  aladin1_10d: {horizon: 10, ic: 0.04, source: "same calibration as the 5-day score (no real record of the 10-day paper trader is long enough); AUC 0.546 implies 0.14"}
  movers_5d: {horizon: 5, ic: 0.06, source: "data/aladin_movers/study_r2b.json auc_up = 0.519"}

costs:                      # per side unless stated; mirrors data/config/aladin2.json "costs"
  delivery_fee_bps: 15.5    # brokerage 3 + STT 10 + exchange 0.35 + SEBI 0.1 + stamp 1.5 (buy) + GST on fees
  futures_fee_bps: 3.0      # brokerage 1 + STT 2 (sell) + exchange 0.18 + stamp 0.2 + GST
  crypto_fee_bps: 12.0      # scripts/crypto_flow.py COST = 0.0012 per fill
  spread_bps: 4             # half-spread paid on every fill in a normal market
  slippage_bps_by_liquidity: [2, 3, 4, 6, 8, 10, 14, 18, 25, 35]   # decile 0 = most liquid (terminal's own table)
  slippage_vol_power: 1.0   # slippage x (today's vol / normal vol) ^ power
  borrow_bps_ann: 0         # stock futures: no borrow fee (basis not modelled)
  fund_rate_ann: 0.065      # idle cash in a liquid fund (call rate) ...
  fund_fee_ann: 0.003       # ... minus the fund's fee (scripts/aladin2/paper.py FUND_FEE)
  dp_charge_inr: 15.93      # depository charge per sale (Rs 10,000 account)

# Severity ladder: 1 = catastrophic ... 10 = flat; plus the single-stock black swan and a random regime chain.
# Days are counted from the start of the evaluated year. Ranges [a, b] are drawn uniformly per seed.
scenarios:
  - {id: S01_systemic_crash, severity: 1, name: "Systemic crash (2008/2020 style)",
     shocks: [{type: crash, start: 60, length: [25, 50], depth: [-0.50, -0.35], recovery: 0.25},
              {type: corr_spike, start: 60, length: 60, idio_mult: 0.35, mkt_vol_mult: 2.0},
              {type: liquidity, start: 60, length: 60, spread_mult: 5.0, fill_haircut: 0.3},
              {type: gaps, start: 60, length: 40, n: 3, size: [-0.08, -0.05]}],
     news: {start: 60, peak: 1.0, decay_days: 40}}
  - {id: S02_flash_crash, severity: 2, name: "Flash crash",
     shocks: [{type: flash, day: 120, low: [-0.12, -0.08], close: [-0.04, -0.02], rebound_days: 5},
              {type: liquidity, start: 120, length: 2, spread_mult: 8.0, fill_haircut: 0.5}],
     news: {start: 120, peak: 0.6, decay_days: 5}}
  - {id: S03_war, severity: 3, name: "War / major geopolitical escalation",
     shocks: [{type: crash, start: 90, length: [15, 25], depth: [-0.15, -0.10], recovery: 0.4},
              {type: extra, asset: oil, start: 90, length: 10, move: 0.40}, {type: extra, asset: gold, start: 90, length: 15, move: 0.08},
              {type: extra, asset: usdinr, start: 90, length: 15, move: 0.05},
              {type: sector, sector: Energy, start: 90, length: 15, move: 0.10}, {type: sector, sector: Airlines, start: 90, length: 15, move: -0.25},
              {type: sector, sector: Consumer, start: 90, length: 15, move: -0.08},
              {type: vol, start: 90, length: 40, mult: 2.0}],
     news: {start: 88, peak: 1.0, decay_days: 30}}
  - {id: S04_sanctions_trade_war, severity: 4, name: "Sanctions / trade war / supply-chain shock",
     shocks: [{type: sector, sector: Metals, start: 70, length: 30, move: -0.20}, {type: sector, sector: Exporters, start: 70, length: 30, move: -0.12},
              {type: sector, sector: Auto, start: 70, length: 30, move: -0.10}, {type: extra, asset: oil, start: 70, length: 20, move: 0.15},
              {type: crash, start: 70, length: [30, 40], depth: [-0.08, -0.05], recovery: 0.3}, {type: vol, start: 70, length: 60, mult: 1.5}],
     news: {start: 68, peak: 0.8, decay_days: 45}}
  - {id: S05_rate_shock, severity: 5, name: "Rate shock / inflation surprise",
     shocks: [{type: extra, asset: bond, start: 80, length: 20, move: -0.08}, {type: crash, start: 80, length: [20, 30], depth: [-0.12, -0.08], recovery: 0.2},
              {type: sector, sector: IT, start: 80, length: 25, move: -0.15}, {type: sector, sector: Financials, start: 80, length: 25, move: 0.04},
              {type: vol, start: 80, length: 40, mult: 1.5}],
     news: {start: 80, peak: 0.5, decay_days: 20}}
  - {id: S06_banking_stress, severity: 6, name: "Banking / credit stress",
     shocks: [{type: sector, sector: Financials, start: 100, length: 25, move: -0.25}, {type: crash, start: 100, length: [20, 30], depth: [-0.12, -0.08], recovery: 0.3},
              {type: vol, start: 100, length: 40, mult: 2.5}, {type: liquidity, start: 100, length: 20, spread_mult: 2.5, fill_haircut: 0.1}],
     news: {start: 100, peak: 0.7, decay_days: 25}}
  - {id: S07_prolonged_bear, severity: 7, name: "Prolonged bear market",
     shocks: [{type: drift, start: 0, length: 252, total: [-0.30, -0.20]}, {type: vol, start: 0, length: 252, mult: 1.4}],
     news: {start: 0, peak: 0.3, decay_days: 252}}
  - {id: S08_sideways_chop, severity: 8, name: "Sideways chop",
     shocks: [{type: chop, start: 0, length: 252, band: 0.04, half_life: 15}],
     news: null}
  - {id: S09_steady_bull, severity: 9, name: "Steady bull market",
     shocks: [{type: drift, start: 0, length: 252, total: [0.18, 0.25]}, {type: vol, start: 0, length: 252, mult: 0.7}],
     news: null}
  - {id: S10_dead_flat, severity: 10, name: "Dead-flat market",
     shocks: [{type: drift, start: 0, length: 252, total: [-0.01, 0.01]}, {type: vol, start: 0, length: 252, mult: 0.3, idio_mult: 0.35},
              {type: liquidity, start: 0, length: 252, spread_mult: 1.5, volume_mult: 0.4, fill_haircut: 0.0}],
     news: null}
  - {id: S11_black_swan_stock, severity: 3, name: "Black swan: one holding gaps -60% overnight",
     shocks: [{type: single_gap, day: 100, size: -0.60, target: top_score}],
     news: null}
  - {id: S12_mixed_regimes, severity: 5, name: "Mixed / random regime sequence",
     shocks: [{type: regime_chain, block: [30, 60], regimes: [bull, chop, bear, crash_lite, flat]}],
     news: {start: 0, peak: 0.4, decay_days: 30, follow_drawdown: true}}

news:                       # synthetic headline flow fed to the terminal's geo_tension.score_region (scripts/geo_tension.py)
  samples_per_day: 4
  base_rate_per_hour: 6.0
  base_tone: 0.02
  rate_mult_at_peak: 4.0
  tone_at_peak: -0.30
  noise_rate_frac: 0.25
  noise_tone: 0.04
  lead_days: 0              # ASSUMPTION: news reacts on the day the shock starts (positive = news before the market moves)

strategies:                 # defaults = the terminal's own values; `sweep` = the GAP test range
  aladin_v3:
    defaults: {buy_top_pct: 0.99, hold_days: 5, risk_pct: 2.0, max_pos_pct: 20.0, max_open: 10, sector_cap_pct: 30.0, stop_atr: 2.0, kelly_mu: 0.0027, kelly_sd: 0.06, kelly_cap: 0.25, adv_part: 0.05, ic: 0.04, cost_mult: 1.0, slip_mult: 1.0}
    sweep: {hold_days: [2, 3, 5, 8, 10], risk_pct: [0.5, 1.0, 2.0, 3.0], max_pos_pct: [5, 10, 20, 30], max_open: [3, 5, 10, 15], buy_top_pct: [0.95, 0.98, 0.99, 0.995], ic: [0.0, 0.02, 0.04, 0.08, 0.14], cost_mult: [0.5, 1.0, 2.0], kelly_mu: [0.0015, 0.0027, 0.005]}
  aladin_v4_shadow:
    defaults: {buy_top_pct: 0.99, sell_bottom_pct: 0.02, hold_days: 5, risk_pct: 2.0, max_pos_pct: 20.0, max_open: 10, sector_cap_pct: 30.0, stop_atr: 2.0, protect_atr: 3.0, short_cap_pct: 50.0, kelly_mu: 0.0027, kelly_sd: 0.06, kelly_cap: 0.25, adv_part: 0.05, ic: 0.04, cost_mult: 1.0, slip_mult: 1.0}
    sweep: {protect_atr: [1.5, 2.0, 3.0, 5.0], short_cap_pct: [0, 25, 50], hold_days: [3, 5, 8], ic: [0.0, 0.02, 0.04, 0.08, 0.14], cost_mult: [0.5, 1.0, 2.0]}
  aladin_small_10k:
    defaults: {buy_top_pct: 0.99, hold_days: 5, risk_pct: 2.0, max_pos_pct: 20.0, max_open: 10, sector_cap_pct: 30.0, stop_atr: 2.0, kelly_mu: 0.0027, kelly_sd: 0.06, kelly_cap: 0.25, adv_part: 0.05, ic: 0.04, cost_mult: 1.0, slip_mult: 1.0, cash: 10000, dp_charge: true}
    sweep: {max_pos_pct: [20, 35, 50], max_open: [2, 3, 5, 10], ic: [0.0, 0.04, 0.14]}
  swing_r1:
    defaults: {list_pct: 0.10, breakout_days: 20, rsi_long: 15, rsi_short: 85, trend_sma: 50, stop_atr: 1.5, target_atr: 3.0, breakeven_atr: 1.5, trail_atr: 1.5, max_days: 5, risk_pct: 1.0, max_pos_pct: 10.0, max_open: 12, short_cap_pct: 50.0, ic: 0.06, cost_mult: 1.0, slip_mult: 1.0}
    sweep: {stop_atr: [1.0, 1.5, 2.5, 4.0], target_atr: [2.0, 3.0, 5.0, 99.0], max_days: [3, 5, 10, 20], risk_pct: [0.5, 1.0, 2.0], short_cap_pct: [0, 50], ic: [0.0, 0.06, 0.14]}
  movers_top_tenth:
    defaults: {list_pct: 0.10, roundtrip_cost: 0.003, ic: 0.06}
    sweep: {list_pct: [0.02, 0.05, 0.10, 0.20], ic: [0.0, 0.03, 0.06, 0.14], roundtrip_cost: [0.0015, 0.003, 0.006]}
  paper_trader_v1:
    defaults: {threshold: 0.60, hold_days: 10, roundtrip_cost: 0.005, max_open: 10, notional: 100000, ic: 0.04}
    sweep: {threshold: [0.55, 0.58, 0.60, 0.65], hold_days: [5, 10, 20], max_open: [5, 10, 20], ic: [0.0, 0.04, 0.14]}
  crypto_trend:
    defaults: {vol_target: 0.40, band: 0.25, smooth: 3, rv_days: 7, sigma_days: 30, long_only: false, fee_bps: 12.0}
    sweep: {vol_target: [0.2, 0.4, 0.8], band: [0.0, 0.15, 0.25, 0.5], smooth: [1, 3, 7], long_only: [false, true]}
  crypto_ha_trend:
    defaults: {stop_atr: 3.0, risk: 0.02, fee_bps: 12.0}
    sweep: {stop_atr: [1.5, 3.0, 5.0], risk: [0.01, 0.02, 0.05]}

benchmarks:
  buy_hold: "equal-weight market index, bought on day 0 of the evaluated year (crypto strategies: BTC)"
  random_entry: "same number of trades and the same average holding period as the strategy, random stocks on random days, same capital per trade and costs"

recommend:                  # thresholds of the rules-based recommendations (analysis/recommendations.py)
  loses_to_random_min_scenarios: 3
  crash_max_dd_limit: -0.30
  cost_share_limit: 0.5     # costs above 50% of gross profit in flat/chop
  fragile_change: 0.5       # a +-20% parameter move changing median Sharpe by more than 50% (and > 0.3 absolute)
  indicator_lag_days: 0     # an indicator that turns after the drawdown starts is informational only
  win_prob_bh: 0.5
